<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cancionero pal' fogón</title>
<meta name="description" content="Cancionero de folklore con acordes y cambio de tono">
<meta name="theme-color" content="#ece7dc">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icono-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cancionero">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="estilos.css">
</head>
<body>

<!-- LISTA DE CANCIONES -->
<section id="vista-lista" class="vista">
  <div class="pagina">
    <div class="filete">
      <span>Folklore</span>
      <span class="der">
        <span id="cantidad"></span>
        <button id="btn-tema" class="tema" aria-label="Cambiar claro / oscuro">◐</button>
      </span>
    </div>
    <h1 class="portada">Cancionero<br><em>pal' fogón</em></h1>
    <p class="bajada"><em>creado por</em> MATEO MISSIO</p>

    <label class="buscador">
      <span class="sr">Buscar</span>
      <input id="buscar" type="search" placeholder="Buscar canción o letra…" autocomplete="off">
    </label>
    <div id="ritmos" class="ritmos" role="tablist"></div>

    <ol id="lista" class="lista"></ol>
    <p id="vacio" class="vacio" hidden>No encontré ninguna canción.</p>
  </div>
</section>

<!-- UNA CANCIÓN -->
<section id="vista-cancion" class="vista" hidden>
  <header class="barra">
    <button id="btn-volver" class="volver" aria-label="Volver a la lista">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" d="M15 5 8 12l7 7"/></svg>
      <span id="c-numero"></span>
    </button>
    <button id="btn-buscar" class="redondo lupa" aria-label="Buscar otra canción" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m15 15 5 5" stroke="currentColor" stroke-width="1.6"/></svg>
    </button>
    <div class="tono" aria-label="Tono">
      <button id="tono-menos" class="redondo" aria-label="Bajar medio tono">−</button>
      <strong id="tono-actual"></strong>
      <button id="tono-mas" class="redondo" aria-label="Subir medio tono">+</button>
    </div>
  </header>
  <div id="panel-buscar" class="panel-buscar" hidden>
    <div class="pagina">
      <label class="buscador">
        <span class="sr">Buscar otra canción</span>
        <input id="buscar-en-cancion" type="search" placeholder="Buscar otra canción…" autocomplete="off">
      </label>
      <ol id="resultados" class="lista mini"></ol>
    </div>
  </div>

  <div class="pagina">
    <h2 id="c-titulo" class="titulo"></h2>
    <p class="meta">
      <span id="c-ritmo"></span>
      <button id="tono-reset" class="reset" hidden>● Volver a mi tono</button>
    </p>
    <article id="c-letra" class="letra"></article>
  </div>

  <footer class="pie">
    <div class="progreso"><span id="progreso"></span></div>
    <div class="pie-fila">
      <div class="tam">
        <button id="letra-menos" aria-label="Letra más chica">A−</button>
        <button id="letra-mas" aria-label="Letra más grande">A+</button>
      </div>
      <input id="scroll-vel" class="vel" type="range" min="1" max="10" value="3" aria-label="Velocidad del desplazamiento" hidden>
      <button id="btn-scroll" class="redondo grande" aria-label="Desplazamiento automático">
        <svg class="ic-play" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" d="M12 4v15m-6-6 6 6 6-6"/></svg>
        <svg class="ic-pausa" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" d="M9 5v14M15 5v14"/></svg>
      </button>
    </div>
  </footer>
</section>

<script src="canciones.js"></script>
<script src="app.js"></script>
</body>
</html>
